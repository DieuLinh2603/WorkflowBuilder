spring:
  application:
    name: workflow-builder
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migration history is immutable. Legacy adoption must be enabled explicitly
    # through environment variables, never silently in every environment.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: simple  # In-memory cache for MVP; switch to Redis later

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081

# JWT Configuration
app:
  pipeline:
    encryption-key: ${PIPELINE_ENCRYPTION_KEY:${app.jwt.secret}}
    max-records: ${PIPELINE_MAX_RECORDS:10000}
    query-timeout-seconds: ${PIPELINE_QUERY_TIMEOUT_SECONDS:30}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  workflow:
    reminder-scheduler-ms: 300000
    delivery-worker-ms: 60000
  password-reset:
    expiration-minutes: 30
    frontend-url: http://localhost:5174/reset-password
    # Chỉ bật cho môi trường local chưa có SMTP. Tắt ở production.
    expose-development-link: ${EXPOSE_PASSWORD_RESET_LINK:false}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.company.workflowbuilder: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
